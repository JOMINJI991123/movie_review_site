<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>영화 리뷰 사이트</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_main.css') }}">
</head>
<body>
    <header>
        <a href="main.html" id="title"><h1>영화 리뷰 사이트</h1></a>
    </header>
    <main>
        <ul id="movie-items" class="horizontal">
            {% for movie in movies %}
            <li class="movie-item">
                <a href="{{movie.page_url}}">
                <img src="{{ url_for('static', filename=movie.image_url) }}" alt="영화 1 이미지">
                <p>{{movie.title}}</p></a>
            </li>
            {% endfor %}
        </ul>
    </main>
